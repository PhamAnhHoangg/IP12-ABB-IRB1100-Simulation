# Cam 1 pose option: 30 deg down (gripper only)
# Try it:  ros2 launch irb1100_vision display.launch.py cam1_tilt_deg:=30
#          ros2 launch irb1100_vision gazebo.launch.py cam1_tilt_deg:=30
# The printed mount for this tilt still has to be generated with cad/camera_mount.py;
# in the simulation the camera is tilted but the mount picture is still the 0 deg one.
tilt_deg: 30
note: "Gripper tip almost always in view, but the wrist is lost about half of the time."
# share of ~1600 sampled poses (gripper tip over the pallet, 0.80-1.10 m high, tool pointing down)
# in which the point is inside the Cam 1 picture. Link origins only, not the full meshes.
# Re-run with: python3 scripts/check_cam_view.py 30
visible_percent:
  gripper_tcp: 98.9
  wrist_link_5: 56.4
  elbow_link_2: 100.0
