# Cam 1 pose option: 0 deg down (current)
# Try it:  ros2 launch irb1100_vision display.launch.py cam1_tilt_deg:=0
#          ros2 launch irb1100_vision gazebo.launch.py cam1_tilt_deg:=0
# The printed mount for this tilt still has to be generated with cad/camera_mount.py;
# in the simulation the camera is tilted but the mount picture is still the 0 deg one.
tilt_deg: 0
note: "Looks horizontally. Upper arm and wrist mostly in view; the gripper tip is in view only about a third of the time when it works over the pallet."
# share of ~1600 sampled poses (gripper tip over the pallet, 0.80-1.10 m high, tool pointing down)
# in which the point is inside the Cam 1 picture. Link origins only, not the full meshes.
# Re-run with: python3 scripts/check_cam_view.py 0
visible_percent:
  gripper_tcp: 30.3
  wrist_link_5: 88.8
  elbow_link_2: 100.0
